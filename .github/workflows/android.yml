name: Android app

on:
  push:
    branches: [master]
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install Capacitor
        working-directory: app
        run: npm ci
      - name: Copy the web shell and plugins into the Android project
        working-directory: app
        run: npx cap sync android
      - name: Restore the app signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/aia-signing
          key: android-release-keystore-v2
      - name: Choose the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets"
            exit 0
          fi
          dir="$HOME/aia-signing"
          mkdir -p "$dir"
          if [ ! -f "$dir/password" ]; then
            pw="$(openssl rand -hex 24)"
            echo "::add-mask::$pw"
            keytool -genkeypair -noprompt -keystore "$dir/release.jks" -alias aia -keyalg RSA -keysize 2048 -validity 10000 -storepass "$pw" -keypass "$pw" -dname "CN=AI Academy, O=rene-guerrero"
            echo "Created a new signing key"
            printf '%s' "$pw" > "$dir/password"
            echo "SAVE_KEY=1" >> "$GITHUB_ENV"
          else
            echo "Reusing the cached signing key"
          fi
          pw="$(cat "$dir/password")"
          echo "::add-mask::$pw"
          keytool -list -v -keystore "$dir/release.jks" -storepass "$pw" | grep -m1 "SHA256:"
          {
            echo "ANDROID_KEYSTORE_PATH=$dir/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$pw"
            echo "ANDROID_KEY_ALIAS=aia"
            echo "ANDROID_KEY_PASSWORD=$pw"
          } >> "$GITHUB_ENV"
      - name: Save the signing key
        if: env.SAVE_KEY == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/aia-signing
          key: android-release-keystore-v2
      - name: Remove the retired signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete android-release-keystore-v1 --repo "${{ github.repository }}" && echo "Deleted the retired key" || echo "No retired key left"
      - name: Build the APK
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ai-academy.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-academy-apk
          path: ${{ runner.temp }}/ai-academy.apk
      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v1.0.${{ github.run_number }}" "$RUNNER_TEMP/ai-academy.apk" \
            --title "AI Academy for Android 1.0.${{ github.run_number }}" \
            --notes "Install: open this page on your phone, download ai-academy.apk and allow installs from your browser. The app loads https://rene-guerrero.github.io/ai-academy/ and adds a daily lesson reminder (Settings, Daily reminder)." \
            --latest
