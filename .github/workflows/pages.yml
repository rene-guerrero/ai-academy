name: Deploy lessons site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/data-gym-cache
            runtime-cache/pyodide
          key: runtime-${{ hashFiles('package-lock.json', 'requirements.txt', 'tools/build_runtime.py') }}
      - name: Prepare the in-browser Python runtime and reference outputs
        run: npm run runtime
      - run: npm run build
      - name: Embed the course for Ask the course
        run: python tools/embed_search.py
      - name: Build with search vectors and enforce search quality
        run: npm run build
        env:
          AIA_REQUIRE_SEARCH: "1"
      - run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Site tests
        run: node tests/smoke.mjs
      - name: In-browser Python tests
        run: node tests/runtime.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
