name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Query Supabase
        run: node tools/keepalive.mjs
      - name: Keep the Android signing key cached
        uses: actions/cache/restore@v4
        with:
          path: ~/aia-signing/release.jks
          key: android-release-keystore-v1
