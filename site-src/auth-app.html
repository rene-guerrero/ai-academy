<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://rene-guerrero.github.io/ai-academy/auth-app.html">
<title>AI Academy sign-in</title>
<style>
:root { color-scheme: light dark; --accent: #4b48c9; --bg: #f5f5f7; --surface: #ffffff; --text: #1d1d1f; --muted: #6e6e73; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --accent: #8e8cff; --bg: #000000; --surface: #1c1c1e; --text: #f5f5f7; --muted: #98989d; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); padding: 24px; box-sizing: border-box; }
main { max-width: 26rem; width: 100%; background: var(--surface); border-radius: 16px; padding: 24px; text-align: center; }
h1 { font-size: 1.375rem; margin: 0 0 8px; }
p { color: var(--muted); line-height: 1.45; margin: 0 0 16px; }
[hidden] { display: none !important; }
.btn { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; font-size: 1.0625rem; text-decoration: none; margin: 8px 0; }
@media (prefers-color-scheme: dark) { .btn { color: #0b0b1a; } }
.alt { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 500; min-height: 44px; line-height: 44px; }
</style>
</head>
<body>
<main id="content">
<h1 id="title">Finish signing in</h1>
<p id="body">Tap the button to open AI Academy and finish signing in.</p>
<a class="btn" id="open" href="#">Open in AI Academy</a>
<a class="alt" id="web" href="index.html">Sign in on this website instead</a>
</main>
<script>
(function () {
  var es = (navigator.language || "").slice(0, 2) === "es";
  if (es) {
    document.documentElement.lang = "es";
    document.getElementById("title").textContent = "Termina de iniciar sesión";
    document.getElementById("body").textContent = "Pulsa el botón para abrir AI Academy y terminar de iniciar sesión.";
    document.getElementById("open").textContent = "Abrir en AI Academy";
    document.getElementById("web").textContent = "Iniciar sesión en esta web";
  }
  var hash = location.hash.replace(/^#/, "");
  var query = location.search.replace(/^\?/, "");
  var params = "h=" + encodeURIComponent(hash) + "&q=" + encodeURIComponent(query);
  var android = /Android/i.test(navigator.userAgent);
  var open = document.getElementById("open");
  open.href = "intent://auth/callback?" + params + "#Intent;scheme=aiacademy;package=io.github.reneguerrero.aiacademy;end";
  document.getElementById("web").href = "index.html" + location.search + location.hash;
  if (!android) {
    open.hidden = true;
    document.getElementById("body").textContent = es ? "Abre este enlace en el teléfono donde tienes la app, o inicia sesión en esta web." : "Open this link on the phone where the app is installed, or sign in on this website.";
  } else {
    setTimeout(function () { location.href = open.href; }, 150);
  }
})();
</script>
</body>
</html>
